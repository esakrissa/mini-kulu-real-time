<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mini-kulu</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 auto 0 0;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
      #status {
        margin: 1rem 0;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      #status b {
        font-weight: 600;
      }
      #transcript {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #transcript li {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        max-width: 85%;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      #transcript li.user {
        align-self: flex-end;
        background: color-mix(in srgb, #3b82f6 25%, transparent);
      }
      #transcript li.interim {
        opacity: 0.6;
      }
      #transcript li.note {
        align-self: center;
        background: none;
        font-size: 0.8rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>mini-kulu</h1>
      <button id="start">Start call</button>
      <button id="resume-audio" hidden>Tap to enable audio</button>
      <button id="enable-mic" hidden>Enable mic</button>
      <button id="hangup" hidden>Hang up</button>
    </header>
    <p id="status">
      Connection: <b id="conn">idle</b> · Agent: <b id="agent">–</b>
    </p>
    <ul id="transcript"></ul>
    <div id="audio" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
